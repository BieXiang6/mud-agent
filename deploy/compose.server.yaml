services:
  api:
    image: node:22-alpine
    container_name: mud-agent-api
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
    command: ["node", "server/index.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4058"
      MARKET_DATA_DIR: /var/lib/mud-agent/market
    ports:
      - "4058:4058"
    volumes:
      - ./app:/app:ro
      - ./data:/var/lib/mud-agent
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4058/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
